[project]
name = "tintervals"
version = "0.3.0"
description = "A collection of tools to work with time intervals and to convert time data"
authors = [
    { name = "Marco Pizzocaro", email = "m.pizzocaro@inrim.it" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4"

dependencies = [
    "numpy>=2.0.1,<3",
    "scipy>=1.14.1,<2",
    "ciso8601>=2.3.2,<3",
]


[project.optional-dependencies]
rocitlinks = [
    "pandas>=2.2.2,<3",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.6.3,<0.7",
    "ipython>=8.27.0,<9",
]

doc = [
    "sphinx>=7.4.7,<8",
    "myst-parser>=3.0.1,<4",
    "sphinx-rtd-theme>=2.0.0,<3",
    "sphinx-autobuild>=2024.9.3,<2025",
    "sphinx-autoapi>=3.3.1,<4",
    "starlette>=0.41.0,<0.42",
    "autodocsumm>=0.2.14,<0.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
